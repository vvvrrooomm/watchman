name: Publish Dev Container Feature

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/publish-devcontainer-feature.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish devcontainer feature
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-feature: "./src"
          features: |
            watchman
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
